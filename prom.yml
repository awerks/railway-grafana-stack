global:
    scrape_interval: 30s
    evaluation_interval: 30s

scrape_configs:
    - job_name: stremio-double-subtitles
      metrics_path: /metrics
      scheme: https
      basic_auth:
          username: ${{ secrets.METRICS_USERNAME }}
          password: ${{ secrets.METRICS_PASSWORD }}
      static_configs:
          - targets:
                - stremio-double-subtitles
